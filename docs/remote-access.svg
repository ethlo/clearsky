<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Phone access through a Cloudflare Tunnel</title>
  <desc id="d">The phone reaches Cloudflare over HTTPS. Cloudflare Access checks the login, then the request goes through the tunnel that cloudflared on the laptop opened outbound, to Clearsky on 127.0.0.1, which checks the Access token again.</desc>
  <style>
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .zone { fill: #f2f4f7; stroke: #e5e7eb; }
    .gate { fill: #fffaeb; stroke: #b54708; stroke-width: 1.2; }
    .t { fill: #111827; font-weight: 600; }
    .s { fill: #4b5563; font-size: 11.5px; }
    .z { fill: #6b7280; font-size: 11px; font-weight: 600; letter-spacing: .06em; }
    .a { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .o { stroke: #6b7280; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrg); }
    #arr path { fill: #2563eb; } #arrg path { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #14171c; stroke: #333a45; } .zone { fill: #1b1f26; stroke: #252a33; } .gate { fill: #2a2010; stroke: #fdb022; }
      .t { fill: #f2f4f7; } .s { fill: #c5cad3; } .z { fill: #8a93a3; }
      .a { stroke: #6b9bff; } #arr path { fill: #6b9bff; } .o { stroke: #8a93a3; } #arrg path { fill: #8a93a3; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="zone" x="170" y="20" width="250" height="260" rx="12"/>
  <text class="z" x="186" y="42">CLOUDFLARE</text>
  <rect class="zone" x="450" y="20" width="390" height="260" rx="12"/>
  <text class="z" x="466" y="42">LAPTOP</text>

  <rect class="box" x="20" y="110" width="120" height="64" rx="10"/>
  <text class="t" x="80" y="138" text-anchor="middle">Phone</text>
  <text class="s" x="80" y="156" text-anchor="middle">browser</text>

  <rect class="gate" x="190" y="70" width="210" height="72" rx="10"/>
  <text class="t" x="295" y="98" text-anchor="middle">Cloudflare Access</text>
  <text class="s" x="295" y="116" text-anchor="middle">login: your email only</text>
  <text class="s" x="295" y="132" text-anchor="middle">adds a signed token</text>

  <rect class="box" x="190" y="180" width="210" height="64" rx="10"/>
  <text class="t" x="295" y="207" text-anchor="middle">Tunnel</text>
  <text class="s" x="295" y="225" text-anchor="middle">your hostname, no open port</text>

  <rect class="box" x="470" y="180" width="140" height="64" rx="10"/>
  <text class="t" x="540" y="207" text-anchor="middle">cloudflared</text>
  <text class="s" x="540" y="225" text-anchor="middle">dials out</text>

  <rect class="gate" x="640" y="62" width="180" height="88" rx="10"/>
  <text class="t" x="730" y="88" text-anchor="middle">Clearsky</text>
  <text class="s" x="730" y="106" text-anchor="middle">container, 127.0.0.1</text>
  <text class="s" x="730" y="122" text-anchor="middle">checks the token again</text>
  <text class="s" x="730" y="138" text-anchor="middle">remote: Copilot Ask only</text>

  <rect class="box" x="640" y="180" width="180" height="64" rx="10"/>
  <text class="t" x="730" y="207" text-anchor="middle">Your logins</text>
  <text class="s" x="730" y="225" text-anchor="middle">gh · acli · Copilot · calendar</text>

  <path class="a" d="M140,132 C165,132 165,106 188,106"/>
  <path class="a" d="M295,142 L295,178"/>
  <path class="a" d="M400,212 L468,212"/>
  <path class="a" d="M610,200 C625,200 620,120 638,112"/>
  <path class="o" d="M730,150 L730,178"/>
</svg>
