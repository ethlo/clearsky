# Builds the website (scripts/build-site.mjs) and publishes it with GitHub Pages.
# Settings → Pages → Source: GitHub Actions. The domain is in site/CNAME.
name: Website
on:
  push:
    branches: [main]
    paths: [site/**, docs/**, README.md, scripts/build-site.mjs, scripts/render-docs.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
