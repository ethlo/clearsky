# Extra mounts for a Linux desktop with GNOME. Use it as your override (Compose reads
# docker-compose.override.yml by itself):  cp docker-compose.gnome.yml docker-compose.override.yml
# The override is yours and not in git: add your own folders below too.
services:
  clearsky:
    volumes:
      # Calendars that GNOME Online Accounts syncs: Clearsky reads Evolution's local caches.
      # (Writable only because SQLite needs to share the cache with Evolution while reading.)
      - ${HOME_DIR}/.cache/evolution/calendar:${HOME_DIR}/.cache/evolution/calendar
      - ${HOME_DIR}/.config/evolution/sources:${HOME_DIR}/.config/evolution/sources:ro
      # More folders Copilot may work in, at the same path as on your machine, for example:
      # - ${HOME_DIR}/notes:${HOME_DIR}/notes
