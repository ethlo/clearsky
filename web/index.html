<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Clearsky</title>
<style>
  [hidden] { display: none !important; }
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f2f4f7; --text: #111827; --text-2: #4b5563; --muted: #6b7280;
    --line: #e5e7eb; --line-strong: #d1d5db; --accent: #2563eb; --accent-soft: #eff4ff;
    --red: #b42318; --red-soft: #fef3f2; --amber: #b54708; --amber-soft: #fffaeb;
    --green: #067647; --green-soft: #ecfdf3; --blue: #175cd3; --blue-soft: #eff8ff; --gray-soft: #f2f4f7;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05); --shadow-lg: 0 12px 32px -8px rgba(16, 24, 40, .18), 0 4px 8px -4px rgba(16, 24, 40, .08);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e12; --surface: #14171c; --surface-2: #1b1f26; --text: #f2f4f7; --text-2: #c5cad3; --muted: #8a93a3;
      --line: #252a33; --line-strong: #333a45; --accent: #6b9bff; --accent-soft: #17223a;
      --red: #ff8a80; --red-soft: #2a1715; --amber: #fdb022; --amber-soft: #2a2010;
      --green: #47cd89; --green-soft: #10251a; --blue: #84adff; --blue-soft: #14213a; --gray-soft: #1f242c;
      --shadow: none; --shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }
  button { font: inherit; cursor: pointer; }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; display: inline-block;
    background: linear-gradient(135deg, #60a5fa, #2563eb 60%, #1e40af); box-shadow: inset 0 -6px 8px rgba(255,255,255,.25); }
  nav { display: flex; gap: 2px; }
  nav a { color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 500; }
  nav a:hover { color: var(--text); background: var(--surface-2); }
  nav a.active { color: var(--text); background: var(--surface); box-shadow: 0 0 0 1px var(--line), var(--shadow); }
  .bar .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); border-radius: 8px; height: 32px;
    padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--text); }

  .page { max-width: 1280px; margin: 0 auto; padding: 20px 24px 48px; }

  /* plan */
  .plan { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .now-line { font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; }
  .now-sub { color: var(--text-2); margin-top: 4px; }
  .now-sub a, .join { color: var(--accent); font-weight: 500; }
  .standup-alert { margin-top: 12px; display: inline-flex; gap: 8px; align-items: center; background: var(--amber-soft); color: var(--amber);
    border-radius: 8px; padding: 6px 10px; font-weight: 500; font-size: 13px; }
  .standup-alert a { color: inherit; text-decoration: underline; }
  .agenda { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
  .agenda div { display: flex; gap: 10px; font-size: 13px; color: var(--text-2); }
  .agenda time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; flex: none; white-space: nowrap; }
  .agenda .on { color: var(--accent); font-weight: 500; }
  .todo { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  .todo li { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: start; }
  .todo li:first-child { border-top: 0; padding-top: 0; }
  .todo li::before { counter-increment: n; content: counter(n); width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .todo .t { font-weight: 550; }
  .todo .d { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .todo .m { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* kpis */
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
  .kpi b { display: block; font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .kpi span { color: var(--muted); font-size: 12.5px; }
  .kpi.alert b { color: var(--red); }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 14px 18px 10px; }
  .card-h h2 { font-size: 14.5px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
  .todo li { position: relative; }
  .mute { flex: none; border: 0; background: none; color: var(--muted); padding: 3px; border-radius: 6px; cursor: pointer; opacity: .45; display: grid; place-items: center; }
  .acts { display: flex; gap: 2px; }
  .done { flex: none; border: 0; background: none; color: var(--muted); padding: 3px; border-radius: 6px; cursor: pointer; opacity: .45; display: grid; place-items: center; }
  .todo li:hover .mute, .mute:focus-visible, .todo li:hover .done, .done:focus-visible { opacity: 1; }
  .mute:hover { background: var(--surface-2); color: var(--text); }
  .done:hover { background: var(--green-soft); color: var(--green); }
  @media (hover: none) { .mute, .done { opacity: .8; } }
  .menu { position: absolute; z-index: 30; min-width: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-lg); padding: 6px; display: flex; flex-direction: column; }
  .menu[hidden] { display: none; }
  .menu-h { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 4px; }
  .menu button { text-align: left; border: 0; background: none; color: var(--text); font: inherit; font-size: 13.5px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
  .menu-date { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-2); padding: 6px 8px; border-top: 1px solid var(--line); margin-top: 4px; }
  .menu-date input { font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .muted-toggle { margin-top: 10px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; padding: 0; cursor: pointer; }
  .muted-toggle:hover { color: var(--text); text-decoration: underline; }
  .muted-list { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
  .muted-list li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; color: var(--text-2); }
  .muted-list a { color: var(--text-2); text-decoration: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted-list span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .muted-list button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .rf { margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
  .rf:hover { background: var(--surface-2); color: var(--text); }
  .rf:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rf.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .plan > .rf { position: absolute; top: 12px; right: 12px; }
  .count { font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-2); border-radius: 99px; padding: 1px 8px; }
  .card-b { padding: 0 18px 12px; }
  .group { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
  ul.rows { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .group + ul .row:first-child, ul.rows .row:first-child { border-top: 0; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 550; overflow-wrap: anywhere; }
  .row .meta { color: var(--muted); font-size: 12.5px; margin-top: 1px; overflow-wrap: anywhere; }
  .row .quote { color: var(--text-2); font-size: 12.5px; margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--line-strong);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hide { flex: none; border: 0; background: none; color: var(--muted); opacity: .35; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .row:hover .hide, .hide:focus { opacity: 1; }
  @media (hover: none) { .hide { opacity: .7; } }
  .hide:hover { background: var(--surface-2); color: var(--text); }
  .ask { flex: none; border: 0; background: none; color: var(--accent); opacity: .35; cursor: pointer; padding: 2px 5px; border-radius: 6px; font-size: 13px; }
  .row:hover .ask, .todo li:hover .ask, .ask:focus { opacity: 1; }
  @media (hover: none) { .ask { opacity: .7; } }
  .ask:hover { background: var(--accent-soft); }
  .badge { flex: none; display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; margin-top: 1px; }
  .b-red { background: var(--red-soft); color: var(--red); } .b-amber { background: var(--amber-soft); color: var(--amber); }
  .b-green { background: var(--green-soft); color: var(--green); } .b-blue { background: var(--blue-soft); color: var(--blue); }
  .b-gray { background: var(--gray-soft); color: var(--text-2); }
  .empty { color: var(--muted); padding: 10px 0 6px; }
  .err { color: var(--red); background: var(--red-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 4px 0 8px; }
  .more { border: 0; background: none; color: var(--accent); padding: 8px 0 2px; font-weight: 500; }

  /* skeleton */
  .sk { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2));
    background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .sk-row { padding: 12px 0; border-top: 1px solid var(--line); }
  .sk-row:first-child { border-top: 0; }
  .sk-row .sk + .sk { margin-top: 7px; width: 55%; height: 10px; }

  /* stand-up */
  .su { max-width: 860px; }
  .su-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .su-head h1 { font-size: 20px; letter-spacing: -.02em; margin: 0; }
  .su-head .sub { color: var(--muted); font-size: 13px; }
  .primary { border: 0; background: var(--accent); color: #fff; border-radius: 8px; height: 32px; padding: 0 12px; font-weight: 500; }
  .primary:hover { filter: brightness(1.08); }
  .su-card { padding: 6px 20px 14px; margin-bottom: 12px; }
  .su-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
  .su-card ul { margin: 0; padding-left: 18px; }
  .su-card li { padding: 4px 0; }
  .ref { color: var(--accent); font-weight: 550; border-bottom: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); }
  .ref:hover { border-bottom-style: solid; }

  /* hover card */
  a.kpi { display: block; color: inherit; text-decoration: none; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  a.kpi:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lg); }
  .card.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
  .group { scroll-margin-top: 80px; }
  .card { scroll-margin-top: 70px; }
  /* Copilot chat */
  .icon-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .icon-btn.primary:hover { color: #fff; filter: brightness(1.08); }
  .icon-btn.small { height: 28px; font-size: 12.5px; padding: 0 10px; white-space: nowrap; }
  .chat { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--surface);
    border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
  .chat.max { width: 100vw; }
  .chat.max .chat-log, .chat.max .chat-in, .chat.max .chat-opts, .chat.max .chat-skills { padding-left: max(14px, calc((100vw - 900px) / 2)); padding-right: max(14px, calc((100vw - 900px) / 2)); }
  .chat-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .chat-h .spacer { flex: 1; }
  .chat-sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-opts { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
  .chat-opts label { display: flex; align-items: center; gap: 6px; }
  .chat-opts input, .chat-opts select { font: inherit; font-size: 12.5px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; }
  #cp-model { width: 150px; }
  .cp-tools { width: 100%; }
  .cp-tools summary { cursor: pointer; color: var(--muted); }
  .cp-tools label { margin-top: 6px; }
  .cp-tools input { flex: 1; }
  .cp-tools .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .chat-skills { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
  .chat-skills:empty { display: none; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); border-radius: 99px; font: inherit; font-size: 12px;
    padding: 3px 10px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chat-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .msg { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--accent-soft); color: var(--text); padding: 8px 12px; border-radius: 12px 12px 2px 12px; max-width: 85%; white-space: pre-wrap; }
  .msg.cp { color: var(--text); }
  .msg.cp pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 12.5px; }
  .msg.cp code { font-size: 12.5px; background: var(--surface-2); border-radius: 4px; padding: 1px 4px; }
  .msg.cp pre code { background: none; padding: 0; }
  .msg.cp .txt { white-space: pre-wrap; }
  .msg.cp a { color: var(--accent); }
  .msg .err { margin: 0; }
  .tool { display: flex; gap: 8px; align-items: baseline; color: var(--text-2); font-size: 12.5px; padding: 3px 0; }
  .tool span { color: var(--muted); }
  .tool i { margin-left: auto; font-style: normal; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .tool.s-failed i { color: var(--red); }
  .tool.s-completed i { color: var(--green); }
  .perm { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .perm-t { font-weight: 600; font-size: 13px; }
  .perm code { display: block; margin-top: 6px; white-space: pre-wrap; word-break: break-all; }
  .perm-b { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .perm-b button { font: inherit; font-size: 12.5px; border-radius: 6px; padding: 4px 10px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); }
  .perm-b button.ok { background: var(--accent); border-color: var(--accent); color: #fff; }
  .perm-done { font-size: 12.5px; color: var(--text-2); }
  .typing { color: var(--muted); font-size: 12.5px; }
  .typing::after { content: '…'; animation: pulse 1.2s infinite; }
  .chat-hist { position: absolute; z-index: 2; left: 0; right: 0; top: 53px; bottom: 0; background: var(--surface); display: flex; flex-direction: column; }
  .chat-hist-h { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
  .chat-hist-h input[type=search] { flex: 1; font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .chat-hist-l { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .hs { display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--text); }
  .hs:hover, .hs.cur { background: var(--surface-2); }
  .hs b { font-weight: 500; font-size: 13.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hs small { color: var(--muted); font-size: 11.5px; }
  .badge { display: inline-block; font-size: 10.5px; border-radius: 99px; padding: 0 6px; margin-left: 6px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
  .badge.work { background: var(--amber-soft); color: var(--amber); }
  .chat-refs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 0; position: relative; }
  .ref { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 99px; font-size: 12px; padding: 2px 4px 2px 10px; max-width: 100%; }
  .ref span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  .ref button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 12px; padding: 0 4px; }
  .ref-pick { position: absolute; z-index: 3; left: 14px; right: 14px; bottom: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; max-height: 50vh; }
  .ref-pick input { font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); border: 0; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; padding: 8px 10px; }
  .ref-pick ul { list-style: none; margin: 0; padding: 4px; overflow-y: auto; }
  .ref-pick li { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; gap: 8px; }
  .ref-pick li:hover, .ref-pick li.on { background: var(--surface-2); }
  .ref-pick li code { color: var(--text-2); font-size: 12px; white-space: nowrap; }
  .ref-pick li small { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .ref-pick .none { color: var(--muted); font-size: 12.5px; padding: 8px; }
  .msg.me .refs-sent { display: block; font-size: 11.5px; color: var(--text-2); margin-bottom: 4px; }
  .chat-empty { color: var(--muted); font-size: 13px; margin: auto; text-align: center; max-width: 300px; }
  .chat-in { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
  .chat-in textarea { flex: 1; resize: none; font: inherit; font-size: 13.5px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; max-height: 200px; }
  .chat-in textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hc { position: absolute; z-index: 50; width: 380px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow-lg); padding: 14px 16px; font-size: 13px; opacity: 0; transform: translateY(4px);
    transition: opacity .12s, transform .12s; pointer-events: none; }
  .hc.on { opacity: 1; transform: none; pointer-events: auto; }
  .hc .top { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
  .hc h3 { font-size: 15px; line-height: 1.35; margin: 6px 0 6px; letter-spacing: -.01em; }
  .hc .people { color: var(--text-2); font-size: 12.5px; }
  .hc p { color: var(--text-2); margin: 8px 0 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .hc .foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .hc .foot a { color: var(--accent); font-weight: 550; }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 900px) { .grid, .plan { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .bar-in, .page { padding-left: 16px; padding-right: 16px; }
    .bar-in { gap: 10px; flex-wrap: wrap; } .status .txt { display: none; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

  <button class="icon-btn primary" id="chat-open" title="Ask GitHub Copilot about your work">✦ Copilot</button>
</div></div>

    <button class="icon-btn small" id="chat-hist-btn" title="Your Copilot sessions, from this app, the terminal or your editor">History</button>
    <button class="icon-btn small" id="chat-new" title="Start a new conversation">New chat</button>

      <label>Also allow <input id="cp-allow" placeholder="shell(git:*), shell(gh:*)" spellcheck="false"></label>
      <label>Also deny <input id="cp-deny" placeholder="url(*), write(**/*.env)" spellcheck="false"></label>

    <textarea id="chat-text" rows="3" placeholder="Ask about your work… (Enter to send, Shift+Enter for a new line)"></textarea>

<script>
const REFRESH_MS = 5 * 60 * 1000;
const SOURCES = ['github', 'jira', 'jiraMentions', 'slack', 'calendar'];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 45 min, 1 h, 2 h 15 min
const dur = (min) => (min < 60 ? `${min} min` : `${Math.floor(min / 60)} h${min % 60 ? ` ${min % 60} min` : ''}`);
const hm = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

// ---------------------------------------------------------------- state

const state = { plan: null };
let pending = 0;
function busy(delta) {
  pending += delta;
  $('#dot').classList.toggle('busy', pending > 0);
  if (pending > 0) $('#status').textContent = 'Updating…';
  else $('#status').textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
}

async function getJson(url) {
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// Each source loads on its own and re-renders as soon as it arrives.
const loading = new Set();
function loadSource(name, force) {
  loading.add(name); busy(1); renderToday();
  return getJson(`/api/source/${name}${force ? '?refresh=1' : ''}`)
    .then((d) => { state[name] = d; })
    .catch((e) => { state[name] = { error: e.message, fetchedAt: new Date().toISOString() }; })
    .finally(() => { loading.delete(name); busy(-1); renderToday(); });
}

// The plan is built from every source; the server reuses what it already has cached.
function loadPlan() {
  loading.add('plan'); busy(1);
  return getJson('/api/plan').then((d) => { state.plan = d; })
    .catch((e) => { state.plan = { error: e.message }; })
    .finally(() => { loading.delete('plan'); busy(-1); renderToday(); });
}

function loadAll(force) {
  for (const name of SOURCES) loadSource(name, force);
  setTimeout(loadPlan, 50);
}

// One panel's refresh button: reload just its sources, then the plan that depends on them.
function refreshPanel(names) {
  Promise.all(names.map((n) => loadSource(n, true))).then(loadPlan);
}

// ---------------------------------------------------------------- hidden items

// Dismissed items live in ~/.config/clearsky/state.json as { key: stamp }, so the plan and
// every browser see them. An item comes back as soon as its stamp changes (new activity).
let dismissed = {};
const csrf = document.querySelector('meta[name=csrf]').content;
const isHidden = (x) => Object.hasOwn(dismissed, x.dismissKey || x.url) && dismissed[x.dismissKey || x.url] === String(x.stamp ?? '');
const vis = (list) => (list || []).filter((x) => !isHidden(x));

// The sources with dismissed items taken out; the panels render from this.
let V = {}, hiddenCount = 0;
function view() {
  const keep = (src, ...lists) => {
    if (!src || src.error) return src;
    const out = { ...src };
    for (const l of lists) { out[l] = vis(src[l]); hiddenCount += (src[l] || []).length - out[l].length; }
    return out;
  };
  hiddenCount = 0;
  V = { g: keep(state.github, 'reviewRequested', 'myPrs', 'mentions', 'assigned'), j: keep(state.jira, 'assigned'),
    jm: keep(state.jiraMentions, 'tickets'), sl: keep(state.slack, 'mentions') };
}

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Clearsky-Token': csrf }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function dismiss(body) {
  try { ({ dismissed } = await post('/api/dismiss', body)); } catch (e) { $('#status').textContent = `Could not save: ${e.message}`; }
  renderToday();
  loadPlan();
}

// ---------------------------------------------------------------- building blocks

const skeleton = (n = 3) => Array.from({ length: n }, () => '<div class="sk-row"><div class="sk"></div><div class="sk"></div></div>').join('');

function refAttrs({ issue, pr }) {
  if (issue) return ` data-issue="${esc(issue)}"`;
  if (pr) return ` data-pr="${esc(pr)}"`;
  return '';
}

// A PR or Jira ticket from its link, to hand to Copilot.
function refFromUrl(url = '') {
  let m = url.match(/github\.com\/([\w.-]+\/[\w.-]+)\/pull\/(\d+)/);
  if (m) return { kind: 'pr', repo: m[1], number: Number(m[2]) };
  m = url.match(/\/browse\/([A-Z][A-Z0-9_]+-\d+)/);
  return m ? { kind: 'issue', key: m[1] } : null;
}
function askButton(url, title) {
  return refFromUrl(url) ? `<button class="ask" data-ask="${esc(url)}" data-title="${esc(title)}" title="Ask Copilot about this" aria-label="Ask Copilot about this">✦</button>` : '';
}

function row({ url, stamp, dismissKey, title, meta, badge, tone, quote, issue, pr }) {
  return `<li class="row">
    ${badge ? `<span class="badge b-${tone || 'gray'}">${esc(badge)}</span>` : ''}
    <div class="main">
      <a class="title" href="${esc(url)}" target="_blank" rel="noopener"${refAttrs({ issue, pr })}>${esc(title)}</a>
      ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}
      ${quote ? `<div class="quote">${esc(quote)}</div>` : ''}
    </div>
    ${askButton(url, title)}
    <button class="hide" title="Dismiss until something new happens" aria-label="Dismiss" data-key="${esc(dismissKey || url)}" data-stamp="${esc(stamp ?? '')}">✕</button>
  </li>`;
}

const expanded = new Set();
function rows(id, items, render, limit = 8) {
  const html = items.map(render).filter(Boolean);
  if (!html.length) return '<div class="empty">Nothing here.</div>';
  const shown = expanded.has(id) ? html : html.slice(0, limit);
  const rest = html.length - shown.length;
  return `<ul class="rows">${shown.join('')}</ul>${rest > 0 ? `<button class="more" data-more="${id}">Show ${rest} more</button>` : ''}`;
}

// Which sources feed each panel, for its refresh button.
const PANEL_SOURCES = { plan: ['calendar'], 'c-review': ['github'], 'c-prs': ['github'],
  'c-mentions': ['github', 'jiraMentions', 'slack'], 'c-left': ['jira', 'github'] };
const REFRESH_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12.5 1.8v2.9H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function refreshButton(id) {
  const names = PANEL_SOURCES[id];
  const spinning = names.some((n) => loading.has(n)) || (id === 'plan' && loading.has('plan'));
  const times = names.map((n) => state[n]?.fetchedAt).filter(Boolean);
  const oldest = times.length ? times.sort()[0] : null;
  const tip = spinning ? 'Refreshing…' : `Refresh${oldest ? ` · updated ${ago(oldest)}` : ''} (Shift-click: everything)`;
  return `<button class="rf${spinning ? ' spin' : ''}" data-refresh="${id}" title="${tip}" aria-label="${tip}">${REFRESH_ICON}</button>`;
}

function card(el, title, count, body) {
  el.innerHTML = `<div class="card-h"><h2>${esc(title)}</h2>${count != null ? `<span class="count">${count}</span>` : ''}${refreshButton(el.id)}</div>
    <div class="card-b">${body}</div>`;
}

const toneOf = { bad: 'red', warn: 'amber', good: 'green', wait: 'blue', neutral: 'gray' };
const prRef = (p) => `${p.repo}#${p.number}`;

// ---------------------------------------------------------------- Today

const MUTE_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 5.5v3l2 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 2.5 1.8 3.7M13 2.5l1.2 1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const when = (iso) => new Date(iso).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
const DONE_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let showLater = false;

// Tasks marked done (back when something new happens) and muted ones (back at a set time).
function laterHtml(done, muted) {
  if (!done.length && !muted.length) return '';
  const label = [done.length && `${done.length} done`, muted.length && `${muted.length} muted`].filter(Boolean).join(', ');
  const item = (m, note, btn) => `<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a><span>${note}</span>${btn}</li>`;
  return `<button class="muted-toggle" id="muted-toggle">${showLater ? 'Hide' : 'Show'} ${label}</button>${showLater ? `<ul class="muted-list">${
    done.map((m) => item(m, m.doneAt ? `done ${when(m.doneAt)}` : 'done', `<button data-undone="${esc(m.key)}">Undo</button>`)).join('')}${
    muted.map((m) => item(m, `until ${when(m.until)}`, `<button data-unmute="${esc(m.key)}">Unmute</button>`)).join('')}</ul>` : ''}`;
}

// The small menu a mute button opens.
const menu = document.createElement('div');
menu.className = 'menu'; menu.hidden = true; menu.setAttribute('role', 'menu');
document.body.append(menu);
function openMuteMenu(btn) {
  const tomorrow = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  menu.dataset.key = btn.dataset.mute;
  menu.innerHTML = `<div class="menu-h">Mute until</div>
    ${[['1h', 'In 1 hour'], ['3h', 'In 3 hours'], ['tomorrow', 'Tomorrow’s stand-up'], ['week', 'In a week']]
      .map(([v, l]) => `<button role="menuitem" data-for="${v}">${l}</button>`).join('')}
    <label class="menu-date">On <input type="date" min="${tomorrow}"></label>`;
  menu.hidden = false;
  const r = btn.getBoundingClientRect();
  menu.style.top = `${r.bottom + window.scrollY + 6}px`;
  menu.style.left = `${Math.max(12, Math.min(r.right + window.scrollX - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 12))}px`;
  menu.querySelector('button').focus();
}
async function mute(key, span) {
  menu.hidden = true;
  try { await post('/api/mute', { key, for: span }); } catch (e) { $('#status').textContent = `Could not save: ${e.message}`; }
  loadPlan();
}
menu.addEventListener('click', (e) => { const v = e.target.closest('[data-for]')?.dataset.for; if (v) mute(menu.dataset.key, v); });
menu.addEventListener('change', (e) => { if (e.target.type === 'date' && e.target.value) mute(menu.dataset.key, e.target.value); });
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-mute]');
  if (btn) { e.stopPropagation(); return menu.hidden || menu.dataset.key !== btn.dataset.mute ? openMuteMenu(btn) : (menu.hidden = true); }
  if (!e.target.closest('.menu')) menu.hidden = true;
  const un = e.target.closest('[data-unmute]')?.dataset.unmute;
  if (un) mute(un, null);
  if (e.target.closest('#muted-toggle')) { showLater = !showLater; renderPlan(); }
  const done = e.target.closest('[data-done]');
  if (done) { dismissed[done.dataset.done] = done.dataset.stamp; dismiss({ key: done.dataset.done, stamp: done.dataset.stamp, done: true }); }
  const undone = e.target.closest('[data-undone]')?.dataset.undone;
  if (undone) { delete dismissed[undone]; dismiss({ key: undone, stamp: null }); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menu.hidden = true; });

function renderPlan() {
  const el = $('#plan'), d = state.plan;
  if (!d) {
    el.innerHTML = `${refreshButton('plan')}<div><div class="eyebrow">Now</div><div class="sk" style="width:70%;height:16px"></div><div class="sk" style="width:45%;margin-top:10px"></div></div>
      <div><div class="eyebrow">Do next</div>${skeleton(3)}</div>`;
    return;
  }
  if (d.error) { el.innerHTML = `${refreshButton('plan')}<div class="err">${esc(d.error)}</div>`; return; }
  const p = d.plan, join = (e) => (e?.url ? ` · <a class="join" href="${esc(e.url)}" target="_blank" rel="noopener">Join</a>` : '');
  let line, sub = '';
  if (p.now) {
    line = `In ${esc(p.now.title)} until ${hm(p.now.end)}`;
    sub = `Then free for ${dur(p.freeMinutes)}${p.next ? `, before ${esc(p.next.title)} at ${hm(p.next.start)}` : ''}${join(p.now)}`;
  } else if (p.afterHours) {
    line = 'Outside working hours';
    sub = 'Here is what is waiting for tomorrow.';
  } else {
    const today = p.next && new Date(p.next.start).toDateString() === new Date().toDateString();
    line = `${dur(p.freeMinutes)} free${today ? ` until ${esc(p.next.title)}` : ' for the rest of the day'}`;
    sub = today ? `Starts at ${hm(p.next.start)}${join(p.next)}`
      : p.next ? `No more meetings today. Next: ${esc(p.next.title)}, ${when(p.next.start)}.`
      : p.calendar ? 'No more meetings today.' : 'Connect your calendar in Settings to plan around meetings.';
  }
  const su = d.nextStandup && (Date.parse(d.nextStandup) - Date.now()) / 6e4;
  const alert = su !== undefined && su <= 30 && su > -15
    ? `<div class="standup-alert">Stand-up ${su > 0 ? `in ${Math.ceil(su)} min` : 'now'} · <a href="#standup">your summary is ready</a></div>` : '';
  const cal = state.calendar || {};
  const calErr = cal.error ? `<div class="err" style="margin-top:12px">Calendar: ${esc(cal.error)}</div>`
    : cal.errors ? `<div style="margin-top:12px;font-size:12px;color:var(--muted)">Calendar (${esc(cal.source)}) loaded; skipped ${Object.entries(cal.errors).map(([n, m]) => `${esc(n)}: ${esc(m)}`).join('; ')}</div>` : '';
  const agenda = p.agenda.length ? `<div class="agenda">${p.agenda.map((e) =>
    `<div class="${p.now && e.start === p.now.start ? 'on' : ''}"><time>${hm(e.start)}</time><span>${esc(e.title)}</span></div>`).join('')}</div>` : '';
  const todo = (p.suggestions.length ? `<ol class="todo">${p.suggestions.map((s) => `<li>
      <div><a class="t" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><div class="d">${esc(s.detail)}</div></div>
      <span class="m">~${dur(s.minutes)}</span>
      <span class="acts">${askButton(s.url, s.title)}<button class="done" data-done="${esc(s.key)}" data-stamp="${esc(s.stamp ?? '')}" title="Done: hide until there's something new" aria-label="Mark done">${DONE_ICON}</button><button class="mute" data-mute="${esc(s.key)}" title="Mute for a while" aria-label="Mute for a while">${MUTE_ICON}</button></span></li>`).join('')}</ol>`
    : '<div class="empty">Nothing urgent fits right now.</div>') + laterHtml(p.done || [], p.muted || []);
  el.innerHTML = `${refreshButton('plan')}<div><div class="eyebrow">Now</div><div class="now-line">${line}</div><div class="now-sub">${sub}</div>${alert}${calErr}${agenda}</div>
    <div><div class="eyebrow">Do next</div>${todo}</div>`;
}

function renderKpis() {
  const g = V.g, j = V.j, jm = V.jm, sl = V.sl;
  const val = (src, fn) => (!src ? '<span class="sk" style="display:block;width:40px;height:22px;margin:3px 0"></span>' : src.error ? '–' : fn(src));
  const mine = (g?.myPrs || []);
  const needs = mine.filter((p) => p.status.owner === 'me' && !p.draft).length;
  const mentionCount = (g?.mentions?.length || 0) + (jm?.tickets?.length || 0) + (sl?.mentions?.length || 0);
  // Each number jumps to the panel (and group) it counts.
  const kpi = (v, label, to, alert) => `<a class="kpi${alert ? ' alert' : ''}" href="#${to}" data-jump="${to}"><b>${v}</b><span>${label}</span></a>`;
  $('#kpis').innerHTML =
    kpi(val(g, (x) => x.reviewRequested.length), 'Reviews waiting on you', 'c-review') +
    kpi(val(g, () => needs), 'Your PRs need action', 'g-prs-me', needs > 0 && mine.some((p) => p.status.tone === 'bad')) +
    kpi(val(g, () => mine.filter((p) => p.status.owner === 'others').length), 'Waiting on others', 'g-prs-others') +
    kpi(g && jm ? mentionCount : val(null), 'Recent mentions', 'c-mentions') +
    kpi(val(j, (x) => x.assigned.filter((i) => i.statusCategory === 'indeterminate').length), 'Jira in progress', 'g-left-indeterminate') +
    kpi(val(j, (x) => x.assigned.length), 'Jira open', 'c-left');
}

function renderReview() {
  const g = V.g, el = $('#c-review');
  if (!g) return card(el, 'Needs your review', null, skeleton());
  if (g.error) return card(el, 'Needs your review', null, `<div class="err">${esc(g.error)}</div>`);
  const list = [...g.reviewRequested].sort((a, b) => (b.rerequested - a.rerequested) || Date.parse(a.requestedAt) - Date.parse(b.requestedAt));
  card(el, 'Needs your review', list.length, rows('review', list, (p) => row({
    url: p.url, stamp: p.stamp, title: p.title, pr: prRef(p),
    badge: p.rerequested ? 'Re-review' : p.draft ? 'Draft' : 'Review', tone: p.rerequested ? 'amber' : p.draft ? 'gray' : 'blue',
    meta: `${prRef(p)} · ${p.author} · requested ${ago(p.requestedAt)}${p.viaTeam ? ' via team' : ''} · +${p.size.additions} −${p.size.deletions}`,
  })));

function renderPrs() {

  }).join('') || '<div class="empty">No open pull requests.</div>';

function renderMentions() {

    // One row per ticket; dismissing it hides the ticket until someone mentions you there again.
    ...(jm?.tickets || []).map((t) => ({ at: t.at, html: () => row({ url: t.url, stamp: t.stamp, dismissKey: t.dismissKey,
      title: `${t.key} · ${t.summary}`, issue: t.key, badge: 'Jira', tone: 'blue', quote: t.excerpt,

// ---------------------------------------------------------------- Stand-up

let standupData = null;

// Turn "SSP-1234" and "org/repo#12" in plain text into links with hover cards.
function linkify(text, jiraBase) {
  return esc(text).replace(/\b([\w.-]+\/[\w.-]+)#(\d+)\b|\b([A-Z][A-Z0-9_]+-\d+)\b/g, (m, repo, num, key) => {
    if (repo) return `<a class="ref" href="https://github.com/${repo}/pull/${num}" target="_blank" rel="noopener" data-pr="${repo}#${num}">${m}</a>`;
    return `<a class="ref" href="${jiraBase ? `${esc(jiraBase)}/browse/${key}` : '#'}" target="_blank" rel="noopener" data-issue="${key}">${key}</a>`;
  });
}

function renderStandup() {
  const s = standupData;
  if (!s) {
    $('#su-body').innerHTML = ['Yesterday', 'Today', 'Blockers'].map((h) => `<section class="card su-card"><h2>${h}</h2>${skeleton(3)}</section>`).join('');
    return;
  }
  if (s.error) { $('#su-body').innerHTML = `<div class="err">${esc(s.error)}</div>`; return; }
  const at = new Date(s.nextStandup).toLocaleString([], { weekday: 'long', hour: '2-digit', minute: '2-digit' });
  const errs = [s.yesterday.github.error && `GitHub: ${s.yesterday.github.error}`, s.yesterday.jira.error && `Jira: ${s.yesterday.jira.error}`].filter(Boolean);
  $('#su-sub').textContent = `For ${at} · since ${s.sinceLabel}`;
  // The text is "*Heading*" lines followed by "- item" lines.
  const sections = [];
  for (const line of s.text.split('\n')) {
    const h = line.match(/^\*(.+?)\*/);
    if (h) sections.push({ title: h[1], items: [] });
    else if (line.startsWith('- ') && sections.length) sections.at(-1).items.push(line.slice(2));
  }
  $('#su-body').innerHTML = (errs.length ? `<div class="err">${esc(errs.join(' · '))}</div>` : '') + sections.map((sec) =>
    `<section class="card su-card"><h2>${esc(sec.title)}</h2><ul>${sec.items.map((i) => `<li>${linkify(i, s.jiraBase)}</li>`).join('')}</ul></section>`).join('');
}

async function loadStandup(force) {
  busy(1);
  try { standupData = await getJson(`/api/standup${force ? '?refresh=1' : ''}`); }
  catch (e) { standupData = { error: e.message }; }
  finally { busy(-1); renderStandup(); }
}

// ---------------------------------------------------------------- hover cards

const hc = $('#hc'), previews = new Map();
let hcFor = null, showTimer = null, hideTimer = null;

function preview(el) {
  const key = el.dataset.issue || el.dataset.pr;
  if (!previews.has(key)) {
    const url = el.dataset.issue ? `/api/issue/${encodeURIComponent(key)}`
      : `/api/pr?repo=${encodeURIComponent(key.split('#')[0])}&number=${key.split('#')[1]}`;
    previews.set(key, getJson(url).catch((e) => ({ error: e.message })));
  }
  return previews.get(key);
}

const statusTone = (c) => (c === 'done' ? 'green' : c === 'indeterminate' ? 'blue' : 'gray');
const prState = (p) => (p.state === 'MERGED' ? ['Merged', 'green'] : p.state === 'CLOSED' ? ['Closed', 'red'] : p.draft ? ['Draft', 'gray']
  : p.reviewDecision === 'APPROVED' ? ['Approved', 'green'] : p.reviewDecision === 'CHANGES_REQUESTED' ? ['Changes requested', 'red'] : ['Open', 'blue']);

function cardHtml(el, d) {
  if (!d) return '<div class="sk" style="width:40%"></div><div class="sk" style="width:85%;height:15px;margin:10px 0"></div><div class="sk"></div><div class="sk" style="margin-top:6px;width:70%"></div>';
  if (d.error) return `<div class="err" style="margin:0">${esc(d.error)}</div>`;
  if (el.dataset.issue) {
    return `<div class="top"><b style="color:var(--text)">${esc(d.key)}</b>${d.type ? `· ${esc(d.type)}` : ''}
        ${d.status ? `<span class="badge b-${statusTone(d.statusCategory)}">${esc(d.status)}</span>` : ''}</div>
      <h3>${esc(d.summary)}</h3>
      <div class="people">${[d.assignee ? `Assignee: ${esc(d.assignee)}` : 'Unassigned', d.priority && `Priority: ${esc(d.priority)}`].filter(Boolean).join(' · ')}</div>
      ${d.description ? `<p>${esc(d.description)}</p>` : ''}
      ${d.url ? `<div class="foot"><a href="${esc(d.url)}" target="_blank" rel="noopener">Open in Jira →</a></div>` : ''}`;
  }
  const [label, tone] = prState(d);
  return `<div class="top"><b style="color:var(--text)">${esc(d.key)}</b><span class="badge b-${tone}">${label}</span></div>
    <h3>${esc(d.title)}</h3>
    <div class="people">${esc(d.author)} · +${d.size.additions} −${d.size.deletions} in ${d.size.files} files · updated ${ago(d.updatedAt)}</div>
    ${d.description ? `<p>${esc(d.description)}</p>` : ''}
    <div class="foot"><a href="${esc(d.url)}" target="_blank" rel="noopener">Open on GitHub →</a></div>`;
}

function place(el) {
  const r = el.getBoundingClientRect(), w = Math.min(380, window.innerWidth - 24);
  const left = Math.min(Math.max(12, r.left + window.scrollX), window.scrollX + window.innerWidth - w - 12);
  const below = r.bottom + 8 + 260 < window.innerHeight;
  hc.style.left = `${left}px`;
  hc.style.top = below ? `${r.bottom + window.scrollY + 8}px` : `${r.top + window.scrollY - hc.offsetHeight - 8}px`;
}

async function showCard(el) {
  hcFor = el;
  hc.innerHTML = cardHtml(el, null);
  hc.classList.add('on');
  place(el);
  const d = await preview(el);
  if (hcFor !== el) return;
  hc.innerHTML = cardHtml(el, d);
  place(el);
}

function hideCard() { hcFor = null; hc.classList.remove('on'); }

document.addEventListener('mouseover', (e) => {
  const el = e.target.closest('[data-issue],[data-pr]');
  if (e.target.closest('#hc')) { clearTimeout(hideTimer); return; }
  if (!el) return;
  clearTimeout(hideTimer);
  if (hcFor === el) return;
  clearTimeout(showTimer);
  showTimer = setTimeout(() => showCard(el), 250);
});
document.addEventListener('mouseout', (e) => {
  if (!e.target.closest('[data-issue],[data-pr],#hc')) return;
  clearTimeout(showTimer);
  hideTimer = setTimeout(hideCard, 200);
});
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-issue],[data-pr]'); if (el) showCard(el); });
document.addEventListener('focusout', (e) => { if (e.target.closest('[data-issue],[data-pr]')) hideTimer = setTimeout(hideCard, 200); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCard(); });

// ---------------------------------------------------------------- Copilot chat

const chat = { session: null, cwd: null, turns: 0, stop: null, info: null, refs: [] };
const CUR_KEY = 'clearsky.chatSession';
// Remember the open chat, so a reload picks it up again.
function rememberChat() {
  try { localStorage.setItem(CUR_KEY, chat.turns ? JSON.stringify({ id: chat.session, cwd: chat.cwd }) : ''); } catch {}
}
const CP_KEY = 'clearsky.copilot';
let cpPrefs = {};
try { cpPrefs = JSON.parse(localStorage.getItem(CP_KEY) || '{}'); } catch {}
const saveCp = () => {
  cpPrefs = { model: $('#cp-model').value.trim(), effort: $('#cp-effort').value, permission: $('#cp-perm').value,
    allow: $('#cp-allow').value, deny: $('#cp-deny').value };
  try { localStorage.setItem(CP_KEY, JSON.stringify(cpPrefs)); } catch {}
  chatSub();
};
function chatSub() {
  const i = chat.info;
  $('#chat-sub').textContent = !i ? '' : !i.available ? 'Copilot CLI not found' : `${i.permissions[$('#cp-perm').value] || ''}${chat.turns ? ` · ${chat.turns} turn${chat.turns > 1 ? 's' : ''}` : ''}`;
}

const jiraBaseGuess = () => standupData?.jiraBase || (state.jira?.assigned?.[0]?.url || '').replace(/\/browse\/.*$/, '') || '';

// Just enough Markdown for chat answers: code blocks, inline code, bold, and links for
// URLs, Jira keys and PRs (which get hover cards).
function md(text) {
  return text.split(/```[\w-]*\n?/).map((part, i) => {
    if (i % 2) return `<pre><code>${esc(part.replace(/\n$/, ''))}</code></pre>`;
    let h = linkify(i ? part.replace(/^\n/, '') : part, jiraBaseGuess());
    h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/^#{1,4} (.+)$/gm, '<b>$1</b>');
    return `<span class="txt">${h}</span>`;
  }).join('');
}

function addMsg(cls, html) {
  const log = $('#chat-log');
  log.querySelector('.chat-empty')?.remove();
  const el = document.createElement('div');
  el.className = `msg ${cls}`;
  el.innerHTML = html;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function newChat() {
  chat.stop?.();
  chat.session = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  chat.cwd = null;
  chat.turns = 0;
  rememberChat();
  showHistory(false);
  $('#chat-log').innerHTML = `<div class="chat-empty">Ask about your PRs, tickets and meetings. Copilot sees what's on your dashboard
    when the chat starts, and runs on your machine with your own Copilot login.</div>`;
  chatSub();
}

async function loadCopilotInfo() {
  try { chat.info = await getJson('/api/copilot'); } catch (e) { chat.info = { available: false, error: e.message }; }
  const i = chat.info;
  $('#cp-models').innerHTML = (i.models || []).map((m) => `<option value="${esc(m)}">`).join('');
  $('#cp-effort').innerHTML = `<option value="">default</option>${(i.efforts || []).map((e) => `<option>${esc(e)}</option>`).join('')}`;
  $('#cp-perm').innerHTML = Object.entries(i.permissions || {}).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('');
  $('#cp-model').value = cpPrefs.model || '';
  $('#cp-effort').value = cpPrefs.effort || '';
  $('#cp-perm').value = cpPrefs.permission && i.permissions?.[cpPrefs.permission] ? cpPrefs.permission : 'ask';
  $('#cp-allow').value = cpPrefs.allow || '';
  $('#cp-deny').value = cpPrefs.deny || '';
  $('#cp-skills').innerHTML = (i.skills || []).map((sk) =>
    `<button class="chip" data-skill="${esc(sk.name)}" title="${esc(sk.description)}">${esc(sk.name)}</button>`).join('');
  if (!i.available) addMsg('cp', `<div class="err">${esc(i.error || 'The GitHub Copilot CLI wasn’t found on this machine. Install it, or set COPILOT_BIN in ~/.config/clearsky/.env.')}</div>`);
  chatSub();
}

// One answer is a list of segments: text, tool steps and approval questions, in order.
function renderAnswer(segs) {
  return segs.map((g) => {
    if (g.type === 'text') return md(g.text);
    if (g.type === 'tool') return `<div class="tool s-${esc(g.status || 'pending')}"><span>⚙</span>${esc(g.title || 'Tool')}<i>${esc((g.status || '').replace('_', ' '))}</i></div>`;
    if (g.type === 'permission') {
      return `<div class="perm"><div class="perm-t">${esc(g.title)}</div>${g.detail ? `<code>${esc(g.detail)}</code>` : ''}
        <div class="perm-b">${g.answered ? `<span class="perm-done">${esc(g.answered)}</span>`
          : g.options.map((o) => `<button class="${/^allow/.test(o.kind) ? 'ok' : 'no'}" data-perm="${esc(g.id)}" data-option="${esc(o.id)}" data-name="${esc(o.name)}">${esc(o.name)}</button>`).join('')}</div></div>`;
    }
    if (g.type === 'error') return `<div class="err">${esc(g.message)}</div>`;
    return '';
  }).join('');
}

// Reopen a Copilot session (from here, the terminal or an editor) with its conversation so far.
async function openSession(id, cwd) {
  chat.stop?.();
  showHistory(false);
  $('#chat-log').innerHTML = '<span class="typing">Opening session</span>';
  try {
    const q = cwd ? `?cwd=${encodeURIComponent(cwd)}` : '';
    const h = await getJson(`/api/copilot/sessions/${encodeURIComponent(id)}${q}`);
    chat.session = h.id; chat.cwd = h.cwd; chat.turns = h.messages.filter((m) => m.role === 'me').length || 1;
    $('#chat-log').innerHTML = '';
    for (const m of h.messages) {
      if (m.role === 'me') addMsg('me', esc(m.text));
      else { const el = addMsg('cp', renderAnswer(m.segs)); el.segs = m.segs; }
    }
    if (!h.messages.length) addMsg('cp', '<span class="perm-done">Nothing said in this session yet. Carry on below.</span>');
    rememberChat();
  } catch (e) {
    newChat();
    addMsg('cp', `<div class="err">Couldn't open that session: ${esc(e.message)}</div>`);
  }
  chatSub();
}

let sessions = null;
async function loadSessions(force) {
  $('#hist-list').innerHTML = '<div class="chat-empty"><span class="typing">Asking Copilot</span></div>';
  try { sessions = await getJson(`/api/copilot/sessions${force ? '?refresh' : ''}`); drawSessions(); }
  catch (e) { $('#hist-list').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function drawSessions() {
  if (!sessions) return;
  const q = $('#hist-q').value.trim().toLowerCase(), here = $('#hist-here').checked;
  const list = sessions.sessions.filter((x) => (!here || x.cwd === sessions.cwd) && (!q || `${x.title} ${x.cwd}`.toLowerCase().includes(q)));
  const folder = (d) => (d || '').split('/').filter(Boolean).pop() || d || '';
  $('#hist-list').innerHTML = list.map((x) => `<button class="hs${x.id === chat.session ? ' cur' : ''}" data-sid="${esc(x.id)}" data-cwd="${esc(x.cwd || '')}">
      <b>${esc(x.title || 'Untitled session')}</b>
      <small>${x.updatedAt ? esc(ago(x.updatedAt)) : ''}${x.cwd ? ` · ${esc(folder(x.cwd))}` : ''}</small>${x.working ? '<span class="badge work">working</span>' : x.open ? '<span class="badge" title="Open in a terminal or editor">open</span>' : ''}${x.here ? '<span class="badge">live here</span>' : ''}
    </button>`).join('') || '<div class="chat-empty">No sessions match.</div>';
}
function showHistory(open = $('#chat-hist').hidden) {
  $('#chat-hist').hidden = !open;
  $('#chat-hist-btn').classList.toggle('on', open);
  if (open) { loadSessions(); $('#hist-q').focus(); }
}

// ---- PRs and tickets attached to the next message

function refLabel(r) { return r.kind === 'issue' ? r.key : `${r.repo.split('/').pop()}#${r.number}`; }
function refCandidates() {
  const out = new Map();
  const add = (r, title, where) => { const k = refLabel(r) + (r.repo || ''); if (!out.has(k)) out.set(k, { ...r, title, where }); };
  const g = state.github || {}, j = state.jira || {}, jm = state.jiraMentions || {};
  const pr = (p, where) => /\/pull\/\d+/.test(p.url || '') && add({ kind: 'pr', repo: p.repo, number: p.number }, p.title, where);
  (g.reviewRequested || []).forEach((p) => pr(p, 'review'));
  (g.myPrs || []).forEach((p) => pr(p, 'my PR'));
  (g.mentions || []).forEach((p) => pr(p, 'mention'));
  (g.assigned || []).forEach((p) => pr(p, 'assigned'));
  (jm.tickets || []).forEach((t) => add({ kind: 'issue', key: t.key }, t.summary, 'mention'));
  (j.assigned || []).forEach((i) => add({ kind: 'issue', key: i.key }, i.summary, i.status || 'Jira'));
  return [...out.values()];
}
// Also take a typed reference: SSP-1234, org/repo#12, or a PR or Jira link.
function parseRef(q) {
  q = q.trim();
  let m = q.match(/github\.com\/([\w.-]+\/[\w.-]+)\/pull\/(\d+)/) || q.match(/^([\w.-]+\/[\w.-]+)#(\d+)$/);
  if (m) return { kind: 'pr', repo: m[1], number: Number(m[2]) };
  m = q.match(/\/browse\/([A-Z][A-Z0-9_]+-\d+)/i) || q.match(/^([A-Z][A-Z0-9_]+-\d+)$/i);
  return m ? { kind: 'issue', key: m[1].toUpperCase() } : null;
}
function drawRefs() {
  $('#cp-refs').querySelectorAll('.ref').forEach((el) => el.remove());
  for (const [i, r] of chat.refs.entries()) {
    if (r.key && r.title?.startsWith(r.key)) r.title = r.title.slice(r.key.length).replace(/^\s*·\s*/, '');
    const el = document.createElement('span');
    el.className = 'ref';
    el.innerHTML = `<span title="${esc(r.title || '')}">${esc(refLabel(r))}${r.title ? ` ${esc(r.title)}` : ''}</span><button type="button" data-unref="${i}" aria-label="Remove">✕</button>`;
    $('#cp-ref-add').before(el);
  }
}
function addRef(r) {
  if (!r || chat.refs.some((x) => refLabel(x) === refLabel(r) && x.repo === r.repo) || chat.refs.length >= 8) return;
  chat.refs.push(r);
  drawRefs();
}
function closeRefPick() { $('#cp-refs .ref-pick')?.remove(); }
function openRefPick() {
  if ($('#cp-refs .ref-pick')) return closeRefPick();
  const box = document.createElement('div');
  box.className = 'ref-pick';
  box.innerHTML = '<input placeholder="Find a PR or ticket, or paste SSP-1234 / a link" spellcheck="false"><ul></ul>';
  $('#cp-refs').append(box);
  const input = box.querySelector('input'), ul = box.querySelector('ul');
  const all = refCandidates();
  let shown = [], on = 0;
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    shown = all.filter((r) => !q || `${refLabel(r)} ${r.repo || ''} ${r.title || ''}`.toLowerCase().includes(q)).slice(0, 40);
    const typed = parseRef(input.value);
    if (typed && !shown.some((r) => refLabel(r) === refLabel(typed))) shown.unshift({ ...typed, title: '', where: 'add' });
    on = Math.min(on, Math.max(shown.length - 1, 0));
    ul.innerHTML = shown.map((r, i) => `<li data-i="${i}" class="${i === on ? 'on' : ''}"><code>${esc(refLabel(r))}</code>${esc(r.title || '')}<small>${esc(r.where || '')}</small></li>`).join('')
      || '<li class="none">Nothing on your dashboard matches. Type a key like SSP-1234 or org/repo#12.</li>';
  };
  const pick = (i) => { const r = shown[i]; if (!r) return; addRef({ ...r }); closeRefPick(); $('#chat-text').focus(); };
  input.addEventListener('input', () => { on = 0; draw(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { on = Math.min(on + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { on = Math.max(on - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { pick(on); e.preventDefault(); }
    else if (e.key === 'Escape') { closeRefPick(); e.stopPropagation(); }
  });
  ul.addEventListener('mousedown', (e) => { const li = e.target.closest('[data-i]'); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
  draw();
  input.focus();
}

async function send(text) {
  if (!text.trim() || chat.stop) return;
  const refs = chat.refs.map(({ kind, key, repo, number }) => ({ kind, key, repo, number }));
  addMsg('me', `${refs.length ? `<span class="refs-sent">📎 ${chat.refs.map((r) => esc(refLabel(r))).join(', ')}</span>` : ''}${esc(text)}`);
  chat.refs = [];
  drawRefs();
  const out = addMsg('cp', '<span class="typing">Thinking</span>');
  const segs = [];
  out.segs = segs;
  const draw = () => { out.innerHTML = renderAnswer(segs) || '<span class="typing">Thinking</span>'; $('#chat-log').scrollTop = $('#chat-log').scrollHeight; };
  const apply = (e) => {
    const last = segs.at(-1);
    if (e.type === 'text') { if (last?.type === 'text') last.text += e.text; else segs.push({ type: 'text', text: e.text }); }
    else if (e.type === 'tool') { const t = segs.find((g) => g.type === 'tool' && g.id === e.id); if (t) Object.assign(t, Object.fromEntries(Object.entries(e).filter(([, v]) => v != null))); else segs.push(e); }
    else if (e.type === 'permission' || e.type === 'error') segs.push(e);
    else if (e.type === 'session') { chat.session = e.id; rememberChat(); }
  };
  const ctrl = new AbortController();
  chat.stop = () => ctrl.abort();
  $('#chat-send').textContent = 'Stop';
  try {
    const res = await fetch('/api/copilot', { method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'X-Clearsky-Token': csrf },
      body: JSON.stringify({ message: text, session: chat.session, resume: chat.turns > 0, cwd: chat.cwd, refs, ...cpPrefs, permission: $('#cp-perm').value }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const l of lines) if (l.trim()) { try { apply(JSON.parse(l)); } catch {} }
      draw();
    }
    const last = segs.at(-1);
    if (last?.type === 'text') last.text = last.text.trimEnd();
    chat.turns++;
  } catch (e) {
    segs.push({ type: 'error', message: e.name === 'AbortError' ? 'Stopped.' : e.message });
    if (e.name === 'AbortError' && segs.length > 1) chat.turns++;
  } finally {
    rememberChat();
    if (!segs.length) segs.push({ type: 'error', message: 'No answer.' });
    draw();
    chat.stop = null;
    $('#chat-send').textContent = 'Send';
    chatSub();
  }
}

// Approve or deny a step Copilot asked about (Ask mode).
$('#chat-log').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-perm]');
  if (!b) return;
  const msg = b.closest('.msg'), seg = msg?.segs?.find((g) => g.type === 'permission' && g.id === b.dataset.perm);
  if (seg) seg.answered = b.dataset.name;
  b.closest('.perm-b').innerHTML = `<span class="perm-done">${esc(b.dataset.name)}</span>`;
  try { await post('/api/copilot/permission', { chat: chat.session, id: b.dataset.perm, option: b.dataset.option }); }
  catch (err) { if (seg) seg.answered = `Couldn't send: ${err.message}`; }
});

function openChat(open = true) {
  $('#chat').hidden = !open;
  try { localStorage.setItem('clearsky.chatOpen', open ? '1' : ''); } catch {}
  if (open) {
    if (!chat.session) {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(CUR_KEY) || 'null'); } catch {}
      if (saved?.id) openSession(saved.id, saved.cwd); else newChat();
    }
    if (!chat.info) loadCopilotInfo();
    $('#chat-text').focus();
  }
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-jump]');
  if (!a) return;
  e.preventDefault();
  const el = document.getElementById(a.dataset.jump) || document.getElementById(a.dataset.jump.replace(/^g-(prs|left)-.*/, 'c-$1'));
  if (!el) return;
  const card = el.closest('.card') || el;
  el.scrollIntoView({ behavior: 'smooth', block: el === card ? 'start' : 'center' });
  card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
});

$('#chat-max').onclick = () => {
  const max = $('#chat').classList.toggle('max');
  $('#chat-max').textContent = max ? '⤡' : '⤢';
  $('#chat-max').title = max ? 'Restore' : 'Maximize';
  try { localStorage.setItem('clearsky.chatMax', max ? '1' : ''); } catch {}
};
try { if (localStorage.getItem('clearsky.chatMax')) $('#chat-max').click(); } catch {}

$('#chat-open').onclick = () => openChat($('#chat').hidden);
$('#chat-close').onclick = () => openChat(false);
$('#chat-new').onclick = newChat;
$('#chat-hist-btn').onclick = () => showHistory();
$('#hist-q').addEventListener('input', drawSessions);
$('#hist-here').addEventListener('change', drawSessions);
$('#hist-refresh').onclick = () => loadSessions(true);
$('#hist-list').addEventListener('click', (e) => { const b = e.target.closest('[data-sid]'); if (b) openSession(b.dataset.sid, b.dataset.cwd); });
$('#cp-ref-add').onclick = openRefPick;
$('#cp-refs').addEventListener('click', (e) => { const i = e.target.closest('[data-unref]')?.dataset.unref; if (i != null) { chat.refs.splice(+i, 1); drawRefs(); } });
document.addEventListener('mousedown', (e) => { if (!e.target.closest('.ref-pick, #cp-ref-add')) closeRefPick(); });
try { if (localStorage.getItem('clearsky.chatOpen')) openChat(true); } catch {}
for (const id of ['#cp-model', '#cp-effort', '#cp-perm', '#cp-allow', '#cp-deny']) $(id).addEventListener('change', saveCp);
$('#chat-form').onsubmit = (e) => {
  e.preventDefault();
  if (chat.stop) return chat.stop();
  const t = $('#chat-text').value;
  $('#chat-text').value = '';
  send(t);
};
$('#chat-text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#chat-form').requestSubmit(); }
});
$('#cp-skills').addEventListener('click', (e) => {
  const name = e.target.closest('[data-skill]')?.dataset.skill;
  if (!name) return;
  const ta = $('#chat-text');
  ta.value = `Use the ${name} skill. ${ta.value}`.trimEnd() + ' ';
  ta.focus();
});

// ---------------------------------------------------------------- wiring

document.addEventListener('click', (e) => {
  const ask = e.target.closest('[data-ask]');
  if (ask) {
    // Start a fresh chat with this PR or ticket attached, ready for your question.
    if (!chat.session || chat.turns) newChat();
    chat.refs = [];
    addRef({ ...refFromUrl(ask.dataset.ask), title: ask.dataset.title });
    openChat(true);
    return;
  }
  const key = e.target.closest('.hide')?.dataset.key;
  if (key) { const b = e.target.closest('.hide'); dismissed[key] = b.dataset.stamp; dismiss({ key, stamp: b.dataset.stamp }); return; }
  const more = e.target.closest('.more')?.dataset.more;
  if (more) { expanded.add(more); renderToday(); }
});

function route() {
  const su = location.hash === '#standup';
  $('#today').hidden = su;
  $('#standup').hidden = !su;
  $('#tab-today').classList.toggle('active', !su);
  $('#tab-standup').classList.toggle('active', su);
  hideCard();
  if (su && !standupData) { renderStandup(); loadStandup(false); }
}
window.addEventListener('hashchange', route);

$('#copy').onclick = async () => {
  const btn = $('#copy');
  try { await navigator.clipboard.writeText(standupData?.text || ''); btn.textContent = 'Copied ✓'; }
  catch { btn.textContent = 'Copy failed'; }
  setTimeout(() => { btn.textContent = 'Copy for Slack'; }, 1500);
};
$('#refresh').onclick = () => { previews.clear(); if (location.hash === '#standup') loadStandup(true); else loadAll(true); };
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-refresh]');
  if (!btn) return;
  if (e.shiftKey) loadAll(true); else refreshPanel(PANEL_SOURCES[btn.dataset.refresh]);
});
$('#unhide').onclick = () => { dismissed = {}; dismiss({ clear: true }); };

try { localStorage.removeItem('clearsky.hidden'); } catch {} // from the browser-only version
renderToday();
getJson('/api/dismissed').then((d) => { dismissed = d.dismissed || {}; renderToday(); }).catch(() => {});
loadAll(false);
route();
setInterval(() => loadAll(false), REFRESH_MS);
</script>
