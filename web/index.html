<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2563eb">
<meta name="csrf" content="__CSRF__">
<title>Clearsky</title>
<script>try { const t = localStorage.getItem('clearsky.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="app">
<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="side" id="side" aria-label="Menu">
  <nav class="nav" id="nav">
    <a class="ni" href="#" data-nav="inbox"><span class="ico" data-i="inbox"></span><span class="lab">Inbox</span><b id="n-inbox"></b></a>
    <a class="ni" href="#calendar" data-nav="calendar"><span class="ico" data-i="calendar"></span><span class="lab">Calendar</span><b id="n-calendar"></b></a>
    <a class="ni" href="#standup" data-nav="standup"><span class="ico" data-i="standup"></span><span class="lab">Stand-up</span></a>
    <a class="ni" href="#notifications" data-nav="notifications"><span class="ico" data-i="bell"></span><span class="lab">Notifications</span></a>
  </nav>
  <div class="sg">Copilot <button type="button" id="cp-new-side" title="New chat (Alt+N)" aria-label="New chat"><span data-i="plus" data-size="14"></span></button></div>
  <div id="side-cp"></div>
  <div class="sg">Work</div>
  <nav id="side-work">
    <a class="ni" href="#reviews" data-nav="reviews"><span class="ico" data-i="review"></span><span class="lab">Reviews</span><b id="n-reviews"></b></a>
    <a class="ni" href="#prs" data-nav="prs"><span class="ico" data-i="pr"></span><span class="lab">Your PRs</span><b id="n-prs"></b></a>
    <a class="ni" href="#mentions" data-nav="mentions"><span class="ico" data-i="at"></span><span class="lab">Mentions</span><b id="n-mentions"></b></a>
    <a class="ni" href="#tickets" data-nav="tickets"><span class="ico" data-i="ticket"></span><span class="lab">Tickets</span><b id="n-tickets"></b></a>
  </nav>
  <div class="sg" id="side-personal-h" hidden>Personal</div>
  <nav id="side-personal"></nav>
  <div class="side-foot">
    <div class="restart-note" id="restart-note" hidden></div>
    <a class="ni" href="/settings"><span class="ico" data-i="settings"></span><span class="lab">Settings</span></a>
    <div class="row1">
      <div class="status"><span class="dot" id="dot"></span><span class="txt" id="status">Loading…</span></div>
      <button class="rf" id="notify" title="Notifications" aria-label="Notifications" hidden></button>
      <button class="rf" id="refresh" title="Refresh everything" aria-label="Refresh everything"></button>
    </div>
    <div class="seg" id="theme" role="group" aria-label="Theme">
      <button data-theme-pick="auto">Auto</button><button data-theme-pick="light">Light</button><button data-theme-pick="dark">Dark</button>
    </div>
  </div>
</aside>

<main class="work">
  <div class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="side"><span data-i="menu"></span><span class="tab-n" id="menu-n" hidden></span></button>
  </div>

  <!-- The inbox, and the Reviews / Your PRs / Mentions / Tickets views of it. -->
  <section class="view" id="v-list">
    <header class="vh"><h1 id="list-title">Inbox</h1>
      <input type="search" id="list-q" class="list-q" placeholder="Filter  /" aria-label="Filter this list (/)" spellcheck="false" autocomplete="off"><span class="spacer"></span><span id="su-alert"></span><button class="fresh" data-fresh title="Refresh everything"></button><button class="nowline" id="nowline" title="Open the calendar"></button></header>
    <div class="view-b" id="list" tabindex="-1"></div>
    <div class="kb"><span><kbd>J</kbd><kbd>K</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>Esc</kbd> back</span>
      <span><kbd>E</kbd> done</span><span><kbd>H</kbd> snooze</span><span><kbd>A</kbd> Copilot</span></div>
  </section>

  <!-- One item in full: a PR, a ticket, a mention, a school message. -->
  <section class="view" id="v-item" hidden>
    <header class="vh"><button class="back" data-back>← Back · Esc</button><span class="sub" id="it-crumb"></span><span class="spacer"></span><button class="nowline" data-nowline></button></header>
    <div class="view-b"><div class="item" id="item"></div></div>
  </section>

  <section class="view" id="v-calendar" hidden>
    <header class="vh"><h1>Calendar</h1><span class="sub" id="cal-sub"></span><span class="spacer"></span><button class="rf" data-refresh="plan" title="Refresh the calendar" aria-label="Refresh the calendar"></button></header>
    <div class="view-b"><div class="cal" id="cal"></div></div>
  </section>

  <section class="view" id="v-standup" hidden>
    <header class="vh"><h1>Stand-up</h1><span class="sub" id="su-sub"></span><span class="spacer"></span><button class="icon-btn primary" id="copy">Copy for Slack</button></header>
    <div class="view-b"><div class="page su" id="su-body"></div></div>
  </section>

  <!-- A source on its own page, such as School. -->
  <section class="view" id="v-notes" hidden>
    <header class="vh"><h1>Recent notifications</h1><span class="sub" id="notes-sub"></span><span class="spacer"></span></header>
    <div class="view-b"><div id="notes"></div></div>
  </section>
  <section class="view" id="v-src" hidden>
    <header class="vh"><h1 id="src-title"></h1><span class="spacer"></span><button class="fresh" data-fresh title="Refresh everything"></button><button class="nowline" data-nowline></button></header>
    <div class="view-b"><div class="page src-page" id="src-body"></div></div>
  </section>

  <!-- Copilot: a chat uses the whole work area, with what it's about on the right. -->
  <section class="view" id="chat" hidden aria-label="Copilot">
    <header class="vh">
      <button class="back" data-back>← Back · Esc</button>
      <h1 id="chat-title" title="Click to rename">Copilot</h1>
      <span class="sub" id="chat-sub"></span>
      <span class="spacer"></span>
      <button class="icon-btn small" id="chat-hist-btn" title="Your Copilot sessions, from this app, the terminal or your editor">History</button>
      <button class="icon-btn small" id="chat-new" title="Start a new conversation (Alt+N)">New chat</button>
    </header>
    <div class="cpw">
      <div class="cp-main">
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-refs" id="cp-refs"></div>
        <form class="chat-in" id="chat-form">
          <div class="cbox">
            <textarea id="chat-text" rows="2" placeholder="Ask a follow-up. Type @ to add a PR or ticket, / for skills." aria-label="Message (Enter sends, Shift+Enter for a new line)"></textarea>
            <div class="cbar">
              <button class="cb-btn" id="cp-ref-add" type="button" title="Give Copilot a PR or Jira ticket to work with (@)" aria-label="Add a PR or ticket"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
              <select class="cb-sel" id="cp-perm" title="What Copilot may do without asking"></select>
              <input class="cb-sel cb-model" id="cp-model" list="cp-models" placeholder="Auto" spellcheck="false" title="Model (empty: Copilot's default)">
              <datalist id="cp-models"></datalist>
              <select class="cb-sel" id="cp-effort" title="Reasoning effort"><option value="">Balanced</option></select>
              <button class="cb-btn" id="chat-mic" type="button" hidden title="Talk: click, speak, click again to stop" aria-label="Talk" aria-pressed="false"><svg viewBox="0 0 16 16"><rect x="5.75" y="1.75" width="4.5" height="8" rx="2.25"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.25"/></svg></button>
              <span class="cb-gap"></span>
              <button class="cb-send" id="chat-send" type="submit" data-state="send" title="Send (Enter)" aria-label="Send"><svg viewBox="0 0 16 16"><path d="M2.5 2.75 14 8 2.5 13.25 4.25 8zM4.25 8H9"/></svg></button>
            </div>
          </div>
        </form>
      </div>
      <aside class="cp-side">
        <div class="chat-ctx" id="chat-ctx" hidden></div>
        <div><h4>Skills</h4><div class="chat-skills" id="cp-skills"></div></div>
        <div><h4>Settings</h4>
          <div class="chat-opts">
            <details class="cp-tools"><summary>Tools</summary>
              <label>Also allow <input id="cp-allow" placeholder="shell(git:*), shell(gh:*)" spellcheck="false"></label>
              <label>Also deny <input id="cp-deny" placeholder="url(*), write(**/*.env)" spellcheck="false"></label>
              <div class="hint">Comma-separated Copilot tool patterns. Deny always wins.</div>
            </details>
          </div>
        </div>
      </aside>
      <div class="chat-hist" id="chat-hist" hidden>
        <div class="chat-hist-h">
          <input type="search" id="hist-q" placeholder="Search sessions…">
          <label title="Only sessions started in Clearsky's Copilot folder"><input type="checkbox" id="hist-here"> This folder</label>
          <button class="icon-btn small" id="hist-refresh" title="Reload the list" aria-label="Reload the list"><span data-i="refresh" data-size="14"></span></button>
        </div>
        <div class="chat-hist-l" id="hist-list"></div>
      </div>
    </div>
  </section>
</main>
</div>

<div class="hc" id="hc" role="tooltip"></div>

<script>
/*__JS__*/
</script>
</body>
</html>
