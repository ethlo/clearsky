# Clearsky in Docker. Put these in a .env next to this file (chmod 600 it: it holds tokens):
#   HOME_DIR              your home folder, e.g. /home/morten (on Windows, a WSL path)
#   UID, GID              your user and group ids (id -u, id -g)
#   PORT                  the port on your machine, 7777 unless you set it
# Then log in once, inside:  docker compose exec -it clearsky clearsky-login
# gh, acli and Copilot keep those logins in the container's own keyring, in
# ~/.config/clearsky/container/; your machine's keyring and logins aren't used or changed.
services:
  clearsky:
    build: .
    image: clearsky:local
    restart: unless-stopped   # also brings it back after Clearsky restarts itself
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: ${HOME_DIR}
      CLEARSKY_PUBLIC_PORT: ${PORT:-7777}
    ports:
      - "127.0.0.1:${PORT:-7777}:7777"  # this machine only
    # Your home inside is a scratch folder (tools keep caches there), with the folders below
    # mounted on top of it.
    tmpfs:
      - ${HOME_DIR}:uid=${UID:-1000},gid=${GID:-1000},mode=0700
    volumes:
      # Your code, where chats run and worktrees go.
      - ${HOME_DIR}/dev:${HOME_DIR}/dev
      # Clearsky's settings and state (and the container's logins), Copilot's sessions and skills.
      - ${HOME_DIR}/.config/clearsky:${HOME_DIR}/.config/clearsky
      - ${HOME_DIR}/.copilot:${HOME_DIR}/.copilot
      # git's settings.
      - ${HOME_DIR}/.gitconfig:${HOME_DIR}/.gitconfig:ro
      # Builds: your JDKs and the Maven cache. Mount only folders that exist (Docker would
      # create a missing one, owned by root); add ~/.sdkman or ~/.gradle if you use them.
      - ${HOME_DIR}/.jdks:${HOME_DIR}/.jdks:ro
      - /usr/lib/jvm:/usr/lib/jvm:ro
      - ${HOME_DIR}/.m2:${HOME_DIR}/.m2
